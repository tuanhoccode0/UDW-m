<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>jQ04 - Click chọn màu hình vuông</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      gap: 20px;
    }

    .cot {
      border: 1px solid #4a90e2;
      padding: 15px;
      width: 300px;
    }

    .o-mau {
      width: 50px;
      height: 50px;
      display: inline-block;
      margin-right: 8px;
      cursor: pointer;
      border: 1px solid #666;
    }

    #khungLon {
      width: 100%;
      height: 250px;
      border: 2px solid #999;
      margin-top: 15px;
    }

    #tenMau {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="cot">
    <p>Click lên các hình vuông:</p>
    <div class="o-mau" style="background-color: blue;"></div>
    <div class="o-mau" style="background-color: red;"></div>
    <div class="o-mau" style="background-color: magenta;"></div>
    <div class="o-mau" style="background-color: green;"></div>
  </div>

  <div class="cot">
    <p>Click lên các hình vuông:</p>
    <div class="o-mau" style="background-color: blue;"></div>
    <div class="o-mau" style="background-color: red;"></div>
    <div class="o-mau" style="background-color: magenta;"></div>
    <div class="o-mau" style="background-color: green;"></div>
    <p id="tenMau"></p>
    <div id="khungLon"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(document).ready(function () {
      var tenMauMap = {
        'blue': 'Xanh dương',
        'red': 'Đỏ',
        'magenta': 'Tím',
        'green': 'Xanh lá'
      };
      $('.o-mau').click(function () {
        var mau = $(this).css('background-color');
        console.log(mau);
        // Đổi màu khung nền
        $('#khungLon').css('background-color', mau);
        var tenMau = $(this).css('background-color');
        var tenMauViet = '';
        if (tenMau === 'rgb(0, 0, 255)') {
        tenMauViet === tenMauMap.blue;
        } else if (tenMau === 'rgb(255, 0, 0)') {
        tenMauViet === tenMauMap.red;
        } else if (tenMau === 'rgb(255, 0, 255)') {
        tenMauViet === tenMauMap.magenta;
        } else if (tenMau === 'rgb(0, 128, 0)') {
          tenMauViet = tenMauMap.green;
        }
        $('#tenMau').text('Màu bạn chọn là' + tenMauViet+': '+ mau).css('color', mau);
});
    });
  </script>
</body>

</html>
