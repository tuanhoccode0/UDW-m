<div align="center"> 
    <h2><b>Đăng Ký Tham Gia Diễn Đàn</b></h2>

    <form action="#" method="post">
        <table border="1" bgcolor="yellow" cellpadding="5">
            <tr>
                <td>Tên Đăng Nhập:</td>
                <td>
                    <input type="text" name="username" placeholder="Nhập Tên Đăng Nhập" required>
                </td>
            </tr>

            <tr>
                <td>Mật Khẩu:</td>
                <td>
                    <input type="password" name="password" required>
                </td>
            </tr>

            <tr>
                <td>Giới Tính:</td>
                <td>
                    <input type="radio" name="gender" value="nam" checked> Nam
                    <input type="radio" name="gender" value="Nữ" checked> Nữ
                </td>
            </tr>

            <tr>
                <td>Ngày Sinh:</td>
                <td>
                    <input type="date" name="birthday" requied>

                </td>
            </tr>

            <tr>
                <td>Email:</td>
                <td>
                    <input type="email" name="email" requied>

                </td>
            </tr>

            <tr>
                <td>Ngôn Ngữ Lập Trình Được Yêu Thich Nhất</td>
                <td>
                <select name="language" style="width: 200px;" required>
                    <option value=""selected disabled>Chọn Ngôn Ngữ ....</option>
                    <option value="Cpp">C++</option>
                    <option value="Csharp">C#</option>
                    <option value="php">PHP</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>
            </td>
            </tr>

            <tr>
                <td>
                    Quy Định Tham Gia Diễn Đàn
                </td>
                <td>
                    <textarea row="1"
                    clos="35"> Bài viết phải nghiêm túc, không chứa quảng cáo, không có nội dung phản cảm</textarea>
                </td>
            </tr>
            <tr>
                <td>
                <td colspan="2" align="center">
                    <button type="submit">
                        <img src="../images/dk.png" alt="Đăng Ký" width="100">
                    </button>

                    <button type="reset">
                        <img src="../images/submit.png" alt="Xóa" width="100">
                    </button>
                </td>
            </td>
            </tr>


        </table>
    </form>
