<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>jQ01 - Thêm môn học</title>
<style>
  body{ font-family: Arial, sans-serif; }
  .box{ width:280px; border:1px solid #4a90e2; padding:15px; border-radius:4px; }
  .box input[type="text"]{ width:96%; padding:5px; margin-bottom:10px; }
  .box ul{ padding-left:20px; margin:0 0 10px 0; }
  .box button{ padding:6px 12px; cursor:pointer; }
</style>
</head>
<body>

<div class="box">
  <label>Tên môn học:</label><br>
  <input type="text" id="txtMon">
  <ul id="dsMon">
    <li>Python</li>
    <li>PHP</li>
  </ul>
  <button id="btnThem">Thêm môn học</button>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(document).ready(function(){

function themmonhoc(){
  var ten =$("#txtMon").val().trim();

  if(ten!=""){
    $("#dsMon").append('<li>' + ten + '</li>');
      $("#txtMon").val('');
      $("#txtMon").focus();
    }
    else {
      alert("vui long nhap ten mon hoc!");
    }
  }

  $("#btnThem").click(function(){
    themmonhoc();
  });

  $("#txtMon").keypress(function(e) {
    if(e.which === 13){
      themmonhoc();
    }
  });

});
</script>
</body>
</html>
