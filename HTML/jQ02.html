<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>jQ02 - Tính số ngày giữa hai thời điểm</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .box {
      width: 320px;
      border: 1px solid #4a90e2;
      padding: 15px;
      border-radius: 4px;
    }

    .box h3 {
      margin-top: 0;
    }

    .box input[type="text"] {
      width: 150px;
      padding: 4px;
    }

    .box button {
      margin-top: 8px;
      padding: 6px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">
    <h3>Tính số ngày giữa hai thời điểm</h3>
    <label>Từ ngày: <input type="text" id="tuNgay" placeholder="MM/DD/YYYY"></label><br><br>
    <label>Đến ngày: <input type="text" id="denNgay" placeholder="MM/DD/YYYY"></label><br>
    <button id="btnTinh">Tính số ngày</button>
    <p id="ketQua"></p>
  </div>



  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(document).ready(function () {
      $("#btnTinh").click(function () {
        var tuNgay = new Date($("#tuNgay").val());
        var denNgay = new Date($("#denNgay").val());
        if (isNaN(tuNgay) || isNaN(denNgay)) {
          $("#ketQua").text('Vui lòng nhập đúng định dạng MM/DD/YYYY.');
          return;
        }
        var soMS = denNgay - tuNgay;
        var soNgay = Math.round(soMS / (24 * 60 * 60 * 1000));
        $("#ketQua").text('Số ngày là:' + soNgay);
      });
    });



  </script>
</body>

</html>
