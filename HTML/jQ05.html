<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>jQ05 - Hover đổi ảnh và phóng to</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      gap: 20px;
    }

    .anh-box {
      border: 1px solid #4a90e2;
      padding: 10px;
      width: 300px;
      height: 280px;
      text-align: center;
    }

    .anh-box img {
      max-width: 100%;
    }
  </style>
</head>

<body>

  <div class="anh-box">
    <img id="anh1" src="../images/cat.jpg" width="250">
  </div>




  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(document).ready(function () {
      $('#anh1').hover(
        function () {
          $(this).attr('src', '../images/dog.jpg');
          $(this).animate({ width: '300px' }, 300);
        },
        function () {
          $(this).attr('src', '../images/cat.jpg');
          $(this).animate({ width: '250px' }, 300);
        }
      );
    });

  </script>
</body>

</html>
