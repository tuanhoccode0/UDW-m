<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>BT04</title>

    <style>
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
        }

        h1 {
            text-align: center;
        }

        thead th {
            background-color: #d9d9d9;
            text-align: center;
        }

        tbody td {
            text-align: center;
        }

        tbody td:first-child {
            text-align: left;
        }

        tfoot td:first-child {
            text-align: left;
        }

        .dat {
            background: yellow;
            color: black;
            font-weight: bold;
        }

        .khongdat {
            background: red;
            color: white;
            font-weight: bold;
        }

        /* Khi in */
        thead {
            display: table-header-group;
        }

        tfoot {
            display: table-footer-group;
        }
    </style>

</head>

<body>

    <h1>KẾT QUẢ HỌC TẬP</h1>

    <table>

        <thead>
            <tr>
                <th rowspan="2">Họ tên</th>
                <th colspan="3">Môn học</th>
                <th rowspan="2">Kết quả</th>
            </tr>

            <tr>
                <th>Toán</th>
                <th>Văn</th>
                <th>Ngoại ngữ</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Trần Văn Thành</td>
                <td>8</td>
                <td>5</td>
                <td>7</td>
                <td class="dat">Đạt</td>
            </tr>

            <tr>
                <td>Lê Thanh Sơn</td>
                <td>4</td>
                <td>9</td>
                <td>6</td>
                <td class="khongdat">Không đạt</td>
            </tr>

            <tr>
                <td>Nguyễn Thị Tuyết</td>
                <td>8</td>
                <td>9</td>
                <td>5</td>
                <td class="dat">Đạt</td>
            </tr>

        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">Tổng số học sinh đạt</td>
                <td>2</td>
            </tr>
        </tfoot>

    </table>
    <a href="../index.html">Về trang chủ</a>
</body>

</html>
